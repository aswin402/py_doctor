[project]
name = "py_doctor"
version = "2.0.0"
description = "Comprehensive FastAPI project health checker"
authors = [{name = "aswin"}]
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "bandit>=1.7.0",
]

[project.scripts]
py_doctor = "py_doctor.cli:main"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["py_doctor*"]
exclude = ["tests*", "docs*"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["tests", "docs", ".venv", "venv"]
skips = ["B101", "B307"]

dependencies = [
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "vulture>=2.3",
    "pip-audit>=2.7.0",
    "rich>=13.0.0"
]

[tool.py_doctor]
lint = true
dead_code = true
types = true
security = true
threshold = 75

[tool.py_doctor.ignore]
rules = ["bandit/B404", "bandit/B603"]
files = ["tests/", "docs/"]
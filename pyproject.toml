[build-system]
requires = ["setuptools>=68.0", "wheel", "setuptools_scm[toml]>=7"]
build-backend = "setuptools.build_meta"

[project]
name = "py-doctor"
version = "1.0.1"
description = "Diagnose and fix your FastAPI project health"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ruff>=0.3.0",
    "mypy>=1.8.0",
    "bandit>=1.7.7",
    "vulture>=2.11",
    "rich>=13.7.0",
    "typer>=0.12.0",
    "tomli>=2.0.1",
]

[project.scripts]
py_doctor = "py_doctor.cli:main"

[tool.uv]
dev-dependencies = [
    "ruff>=0.3.0",
    "mypy>=1.8.0",
    "bandit>=1.7.7",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["py_doctor*"]

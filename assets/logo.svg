<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Neon Emerald to Cyan Gradient -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>

    <!-- Accent Python Yellow to Green Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#06B6D4" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.8" />
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="neonPulse" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur1" />
      <feGaussianBlur stdDeviation="6" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Radial backdrop glow -->
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#10B981" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Base Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="3" />

  <!-- Ambient Center Glow -->
  <circle cx="256" cy="256" r="180" fill="url(#centerGlow)" />

  <!-- Grid Accents for Tech Aesthetic -->
  <g opacity="0.08" stroke="#38BDF8" stroke-width="1">
    <line x1="128" y1="64" x2="128" y2="448" />
    <line x1="256" y1="64" x2="256" y2="448" />
    <line x1="384" y1="64" x2="384" y2="448" />
    <line x1="64" y1="128" x2="448" y2="128" />
    <line x1="64" y1="256" x2="448" y2="256" />
    <line x1="64" y1="384" x2="448" y2="384" />
  </g>

  <!-- Medical Cross Geometry (Rounded Modern Silhouette) -->
  <g filter="url(#glow)">
    <!-- Vertical Cross Bar -->
    <rect x="216" y="104" width="80" height="304" rx="28" fill="#1E293B" stroke="url(#primaryGrad)" stroke-width="3" opacity="0.85" />
    <!-- Horizontal Cross Bar -->
    <rect x="104" y="216" width="304" height="80" rx="28" fill="#1E293B" stroke="url(#primaryGrad)" stroke-width="3" opacity="0.85" />
  </g>

  <!-- Python Snakes Stethoscope Intertwined Curves -->
  <!-- Top snake loop (Cyan to Emerald) -->
  <path d="M 180 200 C 180 150, 220 136, 260 136 C 310 136, 340 165, 340 210 C 340 260, 290 270, 256 270"
        fill="none" stroke="url(#primaryGrad)" stroke-width="18" stroke-linecap="round" />
  <circle cx="180" cy="200" r="9" fill="#10B981" />

  <!-- Bottom snake loop (Blue to Emerald) -->
  <path d="M 332 312 C 332 362, 292 376, 252 376 C 202 376, 172 347, 172 302 C 172 252, 222 242, 256 242"
        fill="none" stroke="url(#accentGrad)" stroke-width="18" stroke-linecap="round" />
  <circle cx="332" cy="312" r="9" fill="#38BDF8" />

  <!-- Center Diagnostic Heartbeat ECG Vital Line -->
  <g filter="url(#neonPulse)">
    <polyline points="80,256 160,256 185,256 205,210 230,310 260,165 290,335 315,256 335,256 432,256"
              fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="0.95" />
    <polyline points="80,256 160,256 185,256 205,210 230,310 260,165 290,335 315,256 335,256 432,256"
              fill="none" stroke="#10B981" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" opacity="0.4" />
  </g>

  <!-- Vital Pulse Target Dots -->
  <circle cx="260" cy="165" r="7" fill="#38BDF8" filter="url(#glow)" />
  <circle cx="290" cy="335" r="7" fill="#10B981" filter="url(#glow)" />
</svg>

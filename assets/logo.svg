<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <defs>
    <!-- Dark Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E131F" />
      <stop offset="100%" stop-color="#05070B" />
    </linearGradient>

    <!-- Subtle Edge Border -->
    <linearGradient id="edge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#06B6D4" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.4" />
    </linearGradient>

    <!-- Core Neon Gradient -->
    <linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <radialGradient id="aura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Canvas Frame -->
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#bg)" stroke="url(#edge)" stroke-width="1.5" />

  <!-- Center Ambient Light -->
  <circle cx="128" cy="128" r="90" fill="url(#aura)" />

  <!-- Minimal Cross Silhouette (Subtle structural guide) -->
  <rect x="117" y="58" width="22" height="140" rx="11" fill="#1E293B" opacity="0.3" />
  <rect x="58" y="117" width="140" height="22" rx="11" fill="#1E293B" opacity="0.3" />

  <!-- Minimalist Health Pulse Geometry -->
  <g filter="url(#softGlow)">
    <!-- Baseline Track -->
    <path d="M 48 128 L 86 128 L 102 96 L 118 160 L 138 78 L 154 154 L 170 128 L 208 128"
          fill="none"
          stroke="url(#neon)"
          stroke-width="5"
          stroke-linecap="round"
          stroke-linejoin="round" />

    <!-- Pulse Peak Marker -->
    <circle cx="138" cy="78" r="4.5" fill="#FFFFFF" />
    <circle cx="138" cy="78" r="9" fill="#06B6D4" opacity="0.4" />
  </g>
</svg>

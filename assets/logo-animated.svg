<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <defs>
    <style>
      @keyframes beamMove {
        0% {
          stroke-dashoffset: 450;
          opacity: 0;
        }
        10% {
          opacity: 1;
        }
        85% {
          opacity: 1;
        }
        100% {
          stroke-dashoffset: -120;
          opacity: 0;
        }
      }

      @keyframes auraBreath {
        0%, 100% {
          opacity: 0.15;
          transform: scale(0.92);
          transform-origin: center;
        }
        50% {
          opacity: 0.35;
          transform: scale(1.08);
          transform-origin: center;
        }
      }

      @keyframes peakPulse {
        0%, 100% {
          transform: scale(1);
          opacity: 0.5;
        }
        50% {
          transform: scale(1.6);
          opacity: 1;
        }
      }

      .pulse-beam {
        stroke-dasharray: 90 400;
        animation: beamMove 2.6s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }

      .pulse-beam-glow {
        stroke-dasharray: 90 400;
        animation: beamMove 2.6s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }

      .ambient-aura {
        animation: auraBreath 3.5s ease-in-out infinite;
      }

      .peak-dot {
        transform-origin: 138px 78px;
        animation: peakPulse 2.6s ease-in-out infinite;
      }
    </style>

    <!-- Dark Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E131F" />
      <stop offset="100%" stop-color="#05070B" />
    </linearGradient>

    <!-- Subtle Edge Border -->
    <linearGradient id="edge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#06B6D4" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.4" />
    </linearGradient>

    <!-- Core Neon Gradient -->
    <linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <radialGradient id="aura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Canvas Frame -->
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#bg)" stroke="url(#edge)" stroke-width="1.5" />

  <!-- Animated Center Ambient Light -->
  <circle class="ambient-aura" cx="128" cy="128" r="90" fill="url(#aura)" />

  <!-- Minimal Structural Cross Guides -->
  <rect x="117" y="58" width="22" height="140" rx="11" fill="#1E293B" opacity="0.25" />
  <rect x="58" y="117" width="140" height="22" rx="11" fill="#1E293B" opacity="0.25" />

  <!-- Static Dimmed Path Track -->
  <path d="M 48 128 L 86 128 L 102 96 L 118 160 L 138 78 L 154 154 L 170 128 L 208 128"
        fill="none"
        stroke="#1E293B"
        stroke-width="3"
        stroke-linecap="round"
        stroke-linejoin="round"
        opacity="0.6" />

  <!-- Animated Health Pulse Beam -->
  <g filter="url(#softGlow)">
    <!-- Wide Glow Layer -->
    <path class="pulse-beam-glow"
          d="M 48 128 L 86 128 L 102 96 L 118 160 L 138 78 L 154 154 L 170 128 L 208 128"
          fill="none"
          stroke="#10B981"
          stroke-width="10"
          stroke-linecap="round"
          stroke-linejoin="round"
          opacity="0.4" />

    <!-- Sharp Bright Core -->
    <path class="pulse-beam"
          d="M 48 128 L 86 128 L 102 96 L 118 160 L 138 78 L 154 154 L 170 128 L 208 128"
          fill="none"
          stroke="url(#neon)"
          stroke-width="4.5"
          stroke-linecap="round"
          stroke-linejoin="round" />

    <!-- Pulse Peak Marker -->
    <circle class="peak-dot" cx="138" cy="78" r="7" fill="#06B6D4" />
    <circle cx="138" cy="78" r="3.5" fill="#FFFFFF" />
  </g>
</svg>
